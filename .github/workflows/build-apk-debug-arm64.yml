name: Build Android APK (arm64-v8a debug)

# This workflow lives on `main` on purpose. Dispatch it from `main` ("Use
# workflow from: main") and then pick the branch to build from the dropdown
# below. Manual dispatch only.
#
# Note: `type: choice` options are static, so a new branch has to be added here
# to appear in the dropdown.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to build'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - feat/effective-fiat-rate
          - feat/about-price-source
          - feat/escrow-deadline-countdown
          - feat/reputation-import-ui
          - feat/reputation-settings-ui
          - feat/reputation-transfer-core
          - fix/bond-qr-and-web-copy
          - fix/ds-cmp-19-amount-fields
          - fix/invoice-cancel-link-font
          - fix/invoice-deadline-waits-for-daemon
          - fix/payout-amount
          - chore/changelog-v2.0.16

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # cargokit (rust_builder) compiles the Rust core while building the APK
      # through rustup's default stable toolchain.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build debug APK (arm64-v8a)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/mostro-debug-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mostro-debug-arm64-v8a
          path: artifacts/mostro-debug-arm64-v8a.apk